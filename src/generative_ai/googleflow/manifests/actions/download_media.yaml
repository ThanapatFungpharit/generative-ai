name: download_media
selectors_name: googleflow
params: [media_id, quality, to]
steps:
  - if:
      # Short: a miss falls back to the editor, which is where videos go.
      visible: {target: media_tile_by_id, timeout: 3000}
      then:
        - click: {target: media_tile_by_id, button: right}
      else:
        - fail: "Google Flow media '{media_id}' was not found."
  # Its entry, not just the menu: entries render a moment after the menu
  # shows, and the submenu check below must see them.
  - wait_for: media_menu_download
  # Generated media offer sizes in a submenu; uploads download at once.
  - download:
      to: "{to}"
      as: path
      timeout: 120000
      steps:
        - if:
            exists: media_menu_download_submenu_trigger
            then:
              - click: media_menu_download
              - run:
                  action: select_download_quality
                  params:
                    quality: "{quality}"
                    menu_index: "1"
                    subject: "media '{media_id}'"
            else:
              - click: media_menu_download
