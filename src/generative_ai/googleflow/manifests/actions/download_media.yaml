name: download_media
selectors_name: googleflow
params: [media_id, quality, to]
steps:
  - if:
      # Short: a miss falls back to the editor, which is where videos go.
      visible: {target: media_tile_by_id, timeout: 3000}
      then:
        - click: {target: media_tile_by_id, button: right}
      else:
        - fail: "Google Flow media '{media_id}' was not found."
  # Its entry, not just the menu: entries render a moment after the menu
  # shows, and the submenu check below must see them.
  - wait_for: media_menu_download
  # Generated media offer sizes in a submenu; uploads download at once.
  - download:
      to: "{to}"
      as: path
      timeout: 120000
      steps:
        - if:
            exists: media_menu_download_submenu_trigger
            then:
              - click: media_menu_download
              - wait_for: download_submenu_item
              # An empty quality means the original size, or else the first
              # enabled entry.
              - if:
                  param: quality
                  then:
                    - if:
                        exists: download_option
                        then:
                          - if:
                              exists: upscaled_download_option
                              then:
                                # An earlier upscale's snackbar, which stays
                                # up a few seconds, would read as this outcome.
                                - wait_for: {target: upscale_outcome_message, state: hidden, timeout: 10000, optional: true}
                                - click: download_option
                                # Flow upscales first, and reports a failure
                                # in a snackbar instead of downloading.
                                - wait_for: {target: upscaling_message, timeout: 5000, optional: true}
                                - wait_for: {target: upscale_outcome_message, timeout: 110000, optional: true}
                                - if:
                                    visible: upscale_failed_message
                                    then:
                                      - get_all_texts: {target: visible_snackbars, exclude: snackbar_controls, as: flow_messages}
                                      - fail: "Google Flow could not upscale media '{media_id}' to '{quality}'."
                              else:
                                - click: download_option
                        else:
                          - get_all_texts: {target: download_options, exclude: icons, as: available}
                          - fail: "Google Flow does not offer download quality '{quality}'."
                  else:
                    - if:
                        exists: original_download_option
                        then:
                          - click: original_download_option
                        else:
                          - click: first_download_option
            else:
              - click: media_menu_download
