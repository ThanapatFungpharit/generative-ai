name: read_generation_settings
selectors_name: googleflow
steps:
  - run: open_generation_settings
  # Each group yields at most one label; a group Flow hides yields none.
  - get_all_texts: {target: checked_mode, exclude: icons, as: mode}
  - get_all_texts: {target: checked_video_type, exclude: icons, as: video_input}
  - get_all_texts: {target: checked_aspect_ratio, exclude: icons, as: aspect_ratio}
  - get_all_texts: {target: checked_video_resolution, exclude: icons, as: resolution}
  - get_all_texts: {target: checked_video_duration, exclude: icons, as: duration}
  - get_all_texts: {target: checked_output_count, exclude: icons, as: outputs}
  - get_text: {target: model_family_button, exclude: icons, as: model}
  # Names fixed values whose group is hidden, such as Veo's 720p.
  - get_text: {target: settings_summary, exclude: icons, as: summary}
