name: confirm_delete_project
selectors_name: googleflow
steps:
  - click: confirm_delete_project_button
  - wait_for: {target: delete_project_dialog, state: hidden}
  # The dialog closes before the server finishes deleting. Navigating away
  # now can abort that request. Flow returns to its project list on success.
  - wait_for: new_project_button
