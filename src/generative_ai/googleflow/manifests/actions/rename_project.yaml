name: rename_project
selectors_name: googleflow
params: [new_name]
steps:
  - click: project_name_input
  - wait_for: project_name_input_editing
  - fill: {target: project_name_input_editing, value: "{new_name}"}
  - press: {target: project_name_input_editing, key: Enter}
  - wait_for: {target: project_name_input_editing, state: hidden}
  - wait_for: {target: project_name_heading, state: attached}
