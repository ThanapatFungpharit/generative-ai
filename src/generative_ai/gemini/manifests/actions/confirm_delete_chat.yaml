name: confirm_delete_chat
selectors_name: gemini
params: base_url
steps:
  - click: confirm_delete_button
  - wait_for: {target: delete_dialog, state: hidden}
  # A closed dialog alone does not establish that deletion finished.
  - wait_for_url: "{base_url}"
  - wait_for: prompt_editor
  - wait_for: {target: first_turn, state: hidden}
