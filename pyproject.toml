 [project]
name = "generative-ai"
version = "0.1.0"
description = "Async Playwright automation for Google Flow"
readme = "README.md"
authors = [
    { name = "ThanapatFungpharit", email = "thanapatsun.pro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.63.0",
    "pyyaml>=6.0.3",
    "web-page @ git+https://github.com/ThanapatFungpharit/web-page@main",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "uv-script>=0.1.9",
]

[tool.uvs.scripts]
format = "ruff format"
lint = "ruff check --fix"
typecheck = "ty check --fix --error all"
check = ["format", "lint", "typecheck"]
